
<!-- NETSOC Header Logo Fix -->
<style>
  #header-desktop .header-title,
  #header-mobile .header-title {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    align-self: center;
    height: 100%;
    margin: 0;
    padding: 0;
  }

  #header-desktop .header-title a,
  #header-mobile .header-title a {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    margin: 0;
    padding: 0;
    line-height: 0;
  }

  #header-desktop .header-title .netsoc-header-logo {
    display: block;
    width: auto !important;
    height: 36px !important;
    max-width: 160px !important;
    object-fit: contain;
    margin: 0 !important;
  }

  #header-mobile .header-title .netsoc-header-logo {
    display: block;
    width: auto !important;
    height: 30px !important;
    max-width: 115px !important;
    object-fit: contain;
    margin: 0 !important;
  }

  #header-desktop .header-wrapper,
  #header-mobile .header-wrapper {
    display: flex;
    align-items: center;
  }
</style>

<script>
(function () {
  const logoUrl =
    "https://www.gravatar.com/avatar/" +
    "325971bc1d5ef7d4ad0e8408aec3be6a" +
    "?s=240&d=mp";

  document.querySelectorAll(
    "#header-desktop .header-title a, " +
    "#header-mobile .header-title a"
  ).forEach(function (link) {
    const img = document.createElement("img");

    img.src = logoUrl;
    img.alt = "NETSOC Cybersecurity";
    img.className = "netsoc-header-logo";
    img.loading = "eager";

    link.replaceChildren(img);
  });

  const favicon =
    document.querySelector('link[rel="icon"]');

  if (favicon) {
    favicon.href = logoUrl;
  }
})();
</script>
<!-- End NETSOC Header Logo Fix -->
